name: PhotoHub
options:
  bundleIdPrefix: personal
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
packages:
  PhotoHubCore:
    path: ..
targets:
  PhotoHub:
    type: application
    platform: iOS
    sources: [PhotoHub]
    dependencies:
      - package: PhotoHubCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: personal.photohub
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Photo Hub
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 選択した写真の原本と撮影日時を取り込むために使用します。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: ダウンロードした原本を写真ライブラリに保存します。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: PhotoHub/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [photohub]
  PhotoHubTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PhotoHubTests]
    dependencies:
      - target: PhotoHub
      - package: PhotoHubCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PhotoHub:
    build:
      targets:
        PhotoHub: all
        PhotoHubTests: [test]
    test:
      targets: [PhotoHubTests]
