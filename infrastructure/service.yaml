AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PhotoHub private owner-only object storage and JWT API
Parameters:
  OwnerSub:
    Type: String
    AllowedPattern: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
  UserPoolId:
    Type: String
    AllowedPattern: 'ap-northeast-1_[A-Za-z0-9]+'
  ClientId:
    Type: String
    AllowedPattern: '[a-z0-9]+'
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Bucket.Arn, !Sub '${Bucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: false
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      Auth:
        DefaultAuthorizer: OwnerJWT
        Authorizers:
          OwnerJWT:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}'
              audience: [!Ref ClientId]
  Function:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: app.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 15
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          BUCKET: !Ref Bucket
          OWNER_SUB: !Ref OwnerSub
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: ['s3:GetObject', 's3:PutObject', 's3:DeleteObject']
              Resource: !Sub '${Bucket.Arn}/users/${OwnerSub}/*'
      Events:
        Objects:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /objects
            Method: POST
            Auth:
              AuthorizationScopes: [openid]
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Function}'
      RetentionInDays: 7
Outputs:
  API:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  BucketName:
    Value: !Ref Bucket
